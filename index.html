  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 840px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      width: 100%;

      display: block;

      cursor: pointer;
    }

<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="640"></canvas>
  </div>

  <script>
    /**
     * FLAPPY DASH - Complete Canvas Game
     * Web Audio API synthesized sound effects.
     */

    // ==========================================
    // 1. CONFIGURATION & CONSTANTS
    // ==========================================
    const CONFIG = {
      WIDTH: 400,
      HEIGHT: 640,
      GROUND_HEIGHT: 100,
      GRAVITY: 980,          // px/s^2
      FLAP_STRENGTH: -330,   // px/s jump impulse
      INITIAL_SPEED: 165,    // pipe & world horizontal speed
      MAX_SPEED: 245,        // max speed as difficulty scales
      PIPE_SPAWN_INTERVAL: 1.5, // seconds between pipes
      PIPE_WIDTH: 64,
      PIPE_CAP_HEIGHT: 26,
      PIPE_CAP_OVERHANG: 5,
      INITIAL_GAP: 152,      // vertical gap between pipes
      MIN_GAP: 112,          // tightest gap at high score
      COLOR_SKY_TOP: '#22a7f0',
      COLOR_SKY_BOTTOM: '#c4f0ff',
      COLOR_GRASS: '#5dbb26',
      COLOR_DIRT: '#e2be78',
      STORAGE_KEY: 'flappy_dash_best_score',
      STORAGE_MUTE: 'flappy_dash_muted'
    };

    // ==========================================
    // 2. AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    class SoundController {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem(CONFIG.STORAGE_MUTE) === 'true';
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem(CONFIG.STORAGE_MUTE, this.muted.toString());
        return this.muted;
      }

      // Flap sound: fast rising pleasant chirp
      playFlap() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(390, t);
          osc.frequency.exponentialRampToValueAtTime(840, t + 0.08);

          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.005, t + 0.09);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.09);
        } catch (e) {}
      }

      // Score sound: two-tone bright chime (B5 -> E6)
      playScore() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          
          // First tone
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(987.77, t);
          gain1.gain.setValueAtTime(0.2, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(t);
          osc1.stop(t + 0.16);

          // Second tone (higher chime)
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1318.51, t + 0.06);
          gain2.gain.setValueAtTime(0.001, t);
          gain2.gain.setValueAtTime(0.26, t + 0.06);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(t + 0.06);
          osc2.stop(t + 0.35);
        } catch (e) {}
      }

      // Hit sound: crunchy low impact thud
      playHit() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          
          // Low punch
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, t);
          osc.frequency.exponentialRampToValueAtTime(30, t + 0.22);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.22);

          // Noise burst
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.06);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.3, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
          noise.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(t);
        } catch (e) {}
      }

      // Medal fanfare: quick ascending major arpeggio
      playMedal() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const t = this.ctx.currentTime + idx * 0.08;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.24);
          });
        } catch (e) {}
      }

      // Cosmetic equip chirp
      playChirp() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(650, t);
          osc.frequency.exponentialRampToValueAtTime(1050, t + 0.08);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.09);
        } catch (e) {}
      }
    }

    const sound = new SoundController();

    // ==========================================
    // 3. PARTICLE SYSTEM
    // ==========================================
    class Particle {
      constructor(x, y, type = 'puff') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.life = 1.0;

        if (type === 'puff') {
          this.vx = (Math.random() - 0.7) * 50;
          this.vy = (Math.random() - 0.2) * 40;
          this.size = Math.random() * 6 + 5;
          this.decay = Math.random() * 2.2 + 2.0;
          this.color = 'rgba(255, 255, 255, ';
        } else if (type === 'feather') {
          this.vx = (Math.random() - 0.5) * 80;
          this.vy = Math.random() * 60 + 20;
          this.size = Math.random() * 4 + 3;
          this.decay = Math.random() * 1.2 + 0.8;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 8;
          this.color = 'rgba(255, 225, 40, ';
        } else if (type === 'star') {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 160 + 80;
          this.vx = Math.cos(angle) * spd;
          this.vy = Math.sin(angle) * spd;
          this.size = Math.random() * 6 + 4;
          this.decay = Math.random() * 2.0 + 1.8;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 10;
          this.color = 'rgba(255, 235, 60, ';
        } else if (type === 'hit') {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 220 + 60;
          this.vx = Math.cos(angle) * spd;
          this.vy = Math.sin(angle) * spd;
          this.size = Math.random() * 5 + 3;
          this.decay = Math.random() * 3.0 + 2.5;
          this.color = Math.random() > 0.5 ? 'rgba(255, 235, 50, ' : 'rgba(255, 100, 40, ';
        }
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= this.decay * dt;
        if (this.type === 'feather' || this.type === 'star') {
          this.rotation += this.rotSpeed * dt;
        }
        return this.life > 0;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.fillStyle = this.color + Math.max(0, this.life).toFixed(2) + ')';

        if (this.type === 'star') {
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.beginPath();
          const spikes = 4;
          const outerRadius = this.size;
          const innerRadius = this.size * 0.45;
          let rot = Math.PI / 2 * 3;
          let step = Math.PI / spikes;
          ctx.moveTo(0, -outerRadius);
          for (let i = 0; i < spikes; i++) {
            ctx.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
            rot += step;
            ctx.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
            rot += step;
          }
          ctx.closePath();
          ctx.fill();
        } else if (this.type === 'feather') {
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size * 1.8, this.size * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // ==========================================
    // 4. PARALLAX BACKGROUND & TIME OF DAY SYSTEM
    // ==========================================
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpColor(c1, c2, t) {
      return [
        Math.round(lerp(c1[0], c2[0], t)),
        Math.round(lerp(c1[1], c2[1], t)),
        Math.round(lerp(c1[2], c2[2], t))
      ];
    }

    function rgbStr(c, a = 1) {
      return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
    }

    const TIME_PHASES = [
      {
        name: 'Sunrise',
        icon: '🌅',
        skyTop: [228, 92, 78],      // warm coral red
        skyMid: [252, 162, 102],    // golden peach
        skyBottom: [255, 230, 168], // soft morning glow
        sunColor: '#fff0a6',
        sunGlowR: 255, sunGlowG: 180, sunGlowB: 100,
        sunY: 125,
        sunAlpha: 1.0,
        moonAlpha: 0.0,
        starsAlpha: 0.0,
        cloudR: 255, cloudG: 236, cloudB: 224, cloudA: 0.92,
        cityColor: [142, 102, 128],
        windowColor: [255, 215, 130],
        windowAlpha: 0.65,
        hillColor: [110, 175, 75],
        grassColor: [95, 172, 38],
        dirtColor: [215, 176, 105]
      },
      {
        name: 'Midday',
        icon: '☀️',
        skyTop: [34, 167, 240],     // vibrant cyan/azure
        skyMid: [104, 202, 247],    // brilliant sky blue
        skyBottom: [196, 240, 255], // pale sunny cyan
        sunColor: '#fff9d2',
        sunGlowR: 255, sunGlowG: 235, sunGlowB: 140,
        sunY: 75,
        sunAlpha: 1.0,
        moonAlpha: 0.0,
        starsAlpha: 0.0,
        cloudR: 255, cloudG: 255, cloudB: 255, cloudA: 0.92,
        cityColor: [159, 211, 230],
        windowColor: [189, 231, 247],
        windowAlpha: 0.85,
        hillColor: [120, 207, 83],
        grassColor: [93, 187, 38],
        dirtColor: [226, 190, 120]
      },
      {
        name: 'Sunset',
        icon: '🌇',
        skyTop: [65, 26, 92],       // deep dusk violet
        skyMid: [226, 75, 88],      // fiery magenta/coral
        skyBottom: [255, 175, 70],  // blazing amber horizon
        sunColor: '#ff7033',
        sunGlowR: 255, sunGlowG: 115, sunGlowB: 45,
        sunY: 155,
        sunAlpha: 0.9,
        moonAlpha: 0.1,
        starsAlpha: 0.15,
        cloudR: 255, cloudG: 195, cloudB: 180, cloudA: 0.88,
        cityColor: [78, 40, 70],
        windowColor: [255, 210, 80],
        windowAlpha: 0.82,
        hillColor: [85, 128, 55],
        grassColor: [72, 132, 32],
        dirtColor: [188, 150, 88]
      },
      {
        name: 'Night',
        icon: '🌙',
        skyTop: [11, 16, 44],       // deep midnight indigo
        skyMid: [22, 30, 72],       // dark navy
        skyBottom: [40, 48, 96],    // atmospheric indigo
        sunColor: '#f1f5f9',
        sunGlowR: 190, sunGlowG: 220, sunGlowB: 255,
        sunY: 90,
        sunAlpha: 0.0,
        moonAlpha: 1.0,
        starsAlpha: 1.0,
        cloudR: 165, cloudG: 180, cloudB: 220, cloudA: 0.45,
        cityColor: [22, 28, 55],
        windowColor: [255, 222, 85],
        windowAlpha: 0.95,
        hillColor: [32, 60, 40],
        grassColor: [45, 92, 22],
        dirtColor: [142, 114, 68]
      }
    ];

    class Background {
      constructor() {
        this.groundOffset = 0;
        this.cloudsOffset = 0;
        this.cityOffset = 0;
        this.time = 0;

        // Time of Day progression
        this.currentPhase = 0;       // floating value 0.0 to 4.0
        this.currentPhaseIndex = 0;  // integer 0, 1, 2, 3
        this.currentPhaseName = TIME_PHASES[0].name;
        this.currentPhaseIcon = TIME_PHASES[0].icon;

        // Static clouds data
        this.clouds = [
          { x: 40,  y: 70,  scale: 1.1 },
          { x: 190, y: 130, scale: 0.8 },
          { x: 320, y: 85,  scale: 1.3 },
          { x: 470, y: 110, scale: 0.95 }
        ];

        // Fixed stars for night sky with twinkling phases
        this.stars = [];
        for (let i = 0; i < 36; i++) {
          this.stars.push({
            x: (i * 37 + 13) % CONFIG.WIDTH,
            y: (i * 29 + 17) % (CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT - 130) + 15,
            size: ((i % 4) * 0.4 + 1.1),
            twinkleSpeed: ((i % 5) * 0.6 + 2.0),
            twinklePhase: i * 1.3
          });
        }

        // Skyline silhouettes with deterministic windows
        this.buildings = [];
        let curX = 0;
        let bId = 0;
        while (curX < 600) {
          const w = 26 + (Math.sin(bId * 1.7) * 0.5 + 0.5) * 28;
          const h = 48 + (Math.cos(bId * 2.3) * 0.5 + 0.5) * 62;
          const windows = [];
          for (let wy = 8; wy < h - 10; wy += 14) {
            windows.push({ x: 4, y: wy, lit: (bId + wy) % 3 !== 0 });
            if (w > 26) {
              windows.push({ x: w - 9, y: wy, lit: (bId * 2 + wy) % 4 !== 0 });
            }
          }
          this.buildings.push({ x: curX, w, h, windows });
          curX += w + 8 + ((bId % 3) * 4);
          bId++;
        }
      }

      reset() {
        this.currentPhase = 0;
        this.currentPhaseIndex = 0;
        this.currentPhaseName = TIME_PHASES[0].name;
        this.currentPhaseIcon = TIME_PHASES[0].icon;
      }

      update(dt, speed, score = 0) {
        this.time += dt;
        this.groundOffset = (this.groundOffset + speed * dt) % 36;
        this.cityOffset = (this.cityOffset + speed * 0.25 * dt) % 400;
        this.cloudsOffset = (this.cloudsOffset + speed * 0.1 * dt) % 500;

        // Score based Time of Day progress
        // 7 points per phase, 28 points per full 24-hour cycle
        const POINTS_PER_PHASE = 7;
        const targetPhase = (score % (POINTS_PER_PHASE * 4)) / POINTS_PER_PHASE;

        // Smooth wrap-around interpolation
        let diff = targetPhase - this.currentPhase;
        if (diff > 2) diff -= 4;
        if (diff < -2) diff += 4;
        this.currentPhase = (this.currentPhase + diff * dt * 1.6 + 4) % 4;

        // Dominant current phase index & name
        const pIdx = Math.round(this.currentPhase) % 4;
        this.currentPhaseIndex = pIdx;
        this.currentPhaseName = TIME_PHASES[pIdx].name;
        this.currentPhaseIcon = TIME_PHASES[pIdx].icon;
      }

      draw(ctx) {
        const W = CONFIG.WIDTH;
        const H = CONFIG.HEIGHT;
        const groundY = H - CONFIG.GROUND_HEIGHT;

        // Calculate blended values between current two phases
        const pIdx1 = Math.floor(this.currentPhase) % 4;
        const pIdx2 = (pIdx1 + 1) % 4;
        const blend = this.currentPhase - Math.floor(this.currentPhase);

        const p1 = TIME_PHASES[pIdx1];
        const p2 = TIME_PHASES[pIdx2];

        const curSkyTop = lerpColor(p1.skyTop, p2.skyTop, blend);
        const curSkyMid = lerpColor(p1.skyMid, p2.skyMid, blend);
        const curSkyBottom = lerpColor(p1.skyBottom, p2.skyBottom, blend);

        const curSunY = lerp(p1.sunY, p2.sunY, blend);
        const curSunAlpha = lerp(p1.sunAlpha, p2.sunAlpha, blend);
        const curMoonAlpha = lerp(p1.moonAlpha, p2.moonAlpha, blend);
        const curStarsAlpha = lerp(p1.starsAlpha, p2.starsAlpha, blend);

        const curSunGlowR = Math.round(lerp(p1.sunGlowR, p2.sunGlowR, blend));
        const curSunGlowG = Math.round(lerp(p1.sunGlowG, p2.sunGlowG, blend));
        const curSunGlowB = Math.round(lerp(p1.sunGlowB, p2.sunGlowB, blend));

        const curCloudR = Math.round(lerp(p1.cloudR, p2.cloudR, blend));
        const curCloudG = Math.round(lerp(p1.cloudG, p2.cloudG, blend));
        const curCloudB = Math.round(lerp(p1.cloudB, p2.cloudB, blend));
        const curCloudA = lerp(p1.cloudA, p2.cloudA, blend);

        const curCityColor = lerpColor(p1.cityColor, p2.cityColor, blend);
        const curWinColor = lerpColor(p1.windowColor, p2.windowColor, blend);
        const curWinAlpha = lerp(p1.windowAlpha, p2.windowAlpha, blend);
        const curHillColor = lerpColor(p1.hillColor, p2.hillColor, blend);
        const curGrassColor = lerpColor(p1.grassColor, p2.grassColor, blend);
        const curDirtColor = lerpColor(p1.dirtColor, p2.dirtColor, blend);

        // 1. Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
        skyGrad.addColorStop(0, rgbStr(curSkyTop));
        skyGrad.addColorStop(0.65, rgbStr(curSkyMid));
        skyGrad.addColorStop(1, rgbStr(curSkyBottom));
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, groundY);

        // 2. Stars (twinkling at night)
        if (curStarsAlpha > 0.02) {
          ctx.save();
          this.stars.forEach(s => {
            const twinkle = 0.5 + 0.5 * Math.sin(this.time * s.twinkleSpeed + s.twinklePhase);
            ctx.fillStyle = `rgba(255, 255, 255, ${(curStarsAlpha * twinkle).toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }

        // 3. Celestial Body: Sun
        if (curSunAlpha > 0.02) {
          const sunX = W - 70;
          const sunY = curSunY;
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, curSunAlpha));

          // Radiant Sun Glow
          const sunGlow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 70);
          sunGlow.addColorStop(0, `rgba(${curSunGlowR}, ${curSunGlowG}, ${curSunGlowB}, 0.85)`);
          sunGlow.addColorStop(0.35, `rgba(${curSunGlowR}, ${curSunGlowG}, ${curSunGlowB}, 0.35)`);
          sunGlow.addColorStop(1, `rgba(${curSunGlowR}, ${curSunGlowG}, ${curSunGlowB}, 0)`);
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 70, 0, Math.PI * 2);
          ctx.fill();

          // Sun Core
          ctx.fillStyle = blend < 0.5 ? p1.sunColor : p2.sunColor;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 4. Celestial Body: Moon (glowing silver crescent at night)
        if (curMoonAlpha > 0.02) {
          const moonX = W - 75;
          const moonY = 85;
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, curMoonAlpha));

          // Soft Celestial Moon Glow
          const moonGlow = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, 60);
          moonGlow.addColorStop(0, 'rgba(220, 238, 255, 0.45)');
          moonGlow.addColorStop(0.5, 'rgba(180, 210, 255, 0.18)');
          moonGlow.addColorStop(1, 'rgba(150, 190, 255, 0)');
          ctx.fillStyle = moonGlow;
          ctx.beginPath();
          ctx.arc(moonX, moonY, 60, 0, Math.PI * 2);
          ctx.fill();

          // Crescent Moon shape
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(moonX, moonY, 20, 0, Math.PI * 2);
          ctx.fill();

          // Dark cutout to create crescent
          ctx.fillStyle = rgbStr(curSkyTop);
          ctx.beginPath();
          ctx.arc(moonX - 9, moonY - 5, 17, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 5. Clouds (parallax scrolling, tinted by time of day)
        ctx.fillStyle = `rgba(${curCloudR}, ${curCloudG}, ${curCloudB}, ${curCloudA.toFixed(2)})`;
        this.clouds.forEach(c => {
          let cx = (c.x - this.cloudsOffset);
          if (cx < -120) cx += 500;
          this.drawCloud(ctx, cx, c.y, c.scale);
        });

        // 6. Distant City Skyline (with time of day lighting & glowing windows)
        ctx.fillStyle = rgbStr(curCityColor);
        this.buildings.forEach(b => {
          let bx = (b.x - this.cityOffset);
          if (bx < -b.w) bx += 480;
          ctx.fillRect(bx, groundY - b.h, b.w, b.h);

          // Windows with dynamic lighting
          b.windows.forEach(win => {
            const wy = groundY - b.h + win.y;
            if (win.lit || curStarsAlpha < 0.3) {
              ctx.fillStyle = rgbStr(curWinColor, curWinAlpha);
              ctx.fillRect(bx + win.x, wy, 4, 6);
            } else {
              // Dim unlit night window
              ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
              ctx.fillRect(bx + win.x, wy, 4, 6);
            }
          });
          ctx.fillStyle = rgbStr(curCityColor);
        });

        // 7. Rolling hills
        ctx.fillStyle = rgbStr(curHillColor);
        ctx.beginPath();
        ctx.ellipse(80, groundY + 12, 130, 40, 0, 0, Math.PI * 2);
        ctx.ellipse(260, groundY + 8, 150, 45, 0, 0, Math.PI * 2);
        ctx.ellipse(420, groundY + 14, 120, 36, 0, 0, Math.PI * 2);
        ctx.fill();

        // 8. Ground
        this.drawGround(ctx, groundY, W, CONFIG.GROUND_HEIGHT, curDirtColor, curGrassColor);
      }

      drawCloud(ctx, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.arc(18, -8, 16, 0, Math.PI * 2);
        ctx.arc(36, 0, 18, 0, Math.PI * 2);
        ctx.arc(18, 8, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawGround(ctx, y, w, h, dirtColor, grassColor) {
        // Dirt body
        ctx.fillStyle = rgbStr(dirtColor);
        ctx.fillRect(0, y, w, h);

        // Ground texture stripes moving at exact pipe speed
        ctx.strokeStyle = rgbStr(dirtColor.map(v => Math.max(0, v - 30)));
        ctx.lineWidth = 3.5;
        const stripeWidth = 18;
        const startX = -this.groundOffset * 1.5;
        ctx.beginPath();
        for (let sx = startX; sx < w + 40; sx += stripeWidth) {
          ctx.moveTo(sx, y + 16);
          ctx.lineTo(sx - 12, y + h);
        }
        ctx.stroke();

        // Top Grass Rim
        ctx.fillStyle = rgbStr(grassColor);
        ctx.fillRect(0, y, w, 15);

        // Grass top highlight
        ctx.fillStyle = rgbStr(grassColor.map(v => Math.min(255, v + 40)));
        ctx.fillRect(0, y, w, 4);

        // Dark edge separator
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, y + 15, w, 3);
        ctx.fillRect(0, y, w, 2);
      }
    }

    class DailyMissionManager {
      constructor() {
        this.storageKey = 'flappy_dash_daily_mission';
        this.cosmeticsKey = 'flappy_dash_unlocked_cosmetics';
        this.equippedKey = 'flappy_dash_equipped_cosmetic';
        this.todayStr = new Date().toISOString().slice(0, 10);

        this.unlockedCosmetics = this.loadUnlockedCosmetics();
        this.equippedCosmetic = localStorage.getItem(this.equippedKey) || (this.unlockedCosmetics.length > 0 ? this.unlockedCosmetics[0] : null);

        this.mission = this.initMission();
      }

      loadUnlockedCosmetics() {
        try {
          const val = localStorage.getItem(this.cosmeticsKey);
          return val ? JSON.parse(val) : [];
        } catch (e) {
          return [];
        }
      }

      saveUnlockedCosmetics() {
        try {
          localStorage.setItem(this.cosmeticsKey, JSON.stringify(this.unlockedCosmetics));
        } catch (e) {}
      }

      initMission() {
        // Deterministic daily index based on date string
        let hash = 0;
        for (let i = 0; i < this.todayStr.length; i++) {
          hash = (hash * 31 + this.todayStr.charCodeAt(i)) & 0x7fffffff;
        }
        const missionDef = DAILY_MISSIONS_POOL[hash % DAILY_MISSIONS_POOL.length];

        let saved = null;
        try {
          const raw = localStorage.getItem(this.storageKey);
          if (raw) saved = JSON.parse(raw);
        } catch (e) {}

        if (saved && saved.date === this.todayStr && saved.id === missionDef.id) {
          return {
            ...missionDef,
            progress: Math.min(missionDef.target, saved.progress || 0),
            completed: !!saved.completed
          };
        } else {
          const fresh = {
            ...missionDef,
            progress: 0,
            completed: false
          };
          this.saveMission(fresh);
          return fresh;
        }
      }

      saveMission(m = this.mission) {
        try {
          localStorage.setItem(this.storageKey, JSON.stringify({
            date: this.todayStr,
            id: m.id,
            progress: m.progress,
            completed: m.completed
          }));
        } catch (e) {}
      }

      toggleCosmetic() {
        if (this.unlockedCosmetics.length === 0) return null;
        const cycle = [null, ...this.unlockedCosmetics];
        const curIdx = cycle.indexOf(this.equippedCosmetic);
        const nextIdx = (curIdx + 1) % cycle.length;
        this.equippedCosmetic = cycle[nextIdx];

        if (this.equippedCosmetic) {
          localStorage.setItem(this.equippedKey, this.equippedCosmetic);
        } else {
          localStorage.removeItem(this.equippedKey);
        }
        return this.equippedCosmetic;
      }

      onFlap(runFlaps) {
        if (this.mission.completed) return false;
        if (this.mission.type === 'single_run_flaps') {
          this.mission.progress = Math.min(this.mission.target, runFlaps);
          if (this.mission.progress >= this.mission.target) {
            return this.completeMission();
          }
          this.saveMission();
        }
        return false;
      }

      onScore(runScore) {
        if (this.mission.completed) return false;
        if (this.mission.type === 'single_run_score') {
          this.mission.progress = Math.min(this.mission.target, runScore);
          if (this.mission.progress >= this.mission.target) {
            return this.completeMission();
          }
          this.saveMission();
        } else if (this.mission.type === 'total_pipes') {
          this.mission.progress = Math.min(this.mission.target, this.mission.progress + 1);
          if (this.mission.progress >= this.mission.target) {
            return this.completeMission();
          }
          this.saveMission();
        }
        return false;
      }

      completeMission() {
        if (this.mission.completed) return false;
        this.mission.completed = true;
        this.mission.progress = this.mission.target;
        this.saveMission();

        if (this.mission.rewardKey && !this.unlockedCosmetics.includes(this.mission.rewardKey)) {
          this.unlockedCosmetics.push(this.mission.rewardKey);
          this.saveUnlockedCosmetics();
        }
        // Auto equip new reward!
        this.equippedCosmetic = this.mission.rewardKey;
        localStorage.setItem(this.equippedKey, this.mission.rewardKey);
        return true;
      }
    }
